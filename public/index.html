<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haytify</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #1ed760;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="logo.png" style="width: 76px; height: 76px; border-radius: 50%; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);" alt="Haytify">
  <div class="spinner"></div>
  <p style="margin-top: 16px; font-weight: 600; color: #b3b3b3; font-size: 0.92rem;">Memuat Haytify...</p>
  <script>
    if (window.location.hostname !== 'haytify.vercel.app') {
      window.location.replace('https://haytify.vercel.app');
    }
  </script>
</body>
</html>
